name: Build Multiplatform (Android / Windows / macOS / iOS / Apple TV / HarmonyOS)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to verify (tag releases always build every platform)
        type: choice
        default: all
        options:
          - all
          - desktop
          - android
          - android-tv
          - android-mobile
          - windows
          - macos
          - ios
          - appletv
          - harmonyos
  push:
    branches:
      - main
    paths:
      - "android-tv/**"
      - "android-mobile/**"
      - "lite/**"
      - "flutter/**"
      - "tvos/**"
      - "shared/**"
      - "scripts/**"
      - ".github/workflows/build-multiplatform.yml"
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-checks:
    name: Public Guardrails & Offline Java Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.38.9"
      - name: Check public content guardrails
        run: python scripts/check_public_content.py
      - name: Check README versions alignment
        run: python scripts/sync_readme_versions.py --check
      - name: Verify runtime assets before platform builds
        run: |
          python scripts/test_drpy_assets.py
          python scripts/update_drpy_assets.py --check
      - name: Check Java formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess
          from scripts.format_java import VERSION, JAR, formatter
          JAR.parent.mkdir(parents=True, exist_ok=True)
          if not JAR.exists():
              subprocess.run(['gh', 'release', 'download', 'v' + VERSION,
                              '--repo', 'google/google-java-format',
                              '--pattern', JAR.name, '--dir', str(JAR.parent)],
                             check=True, timeout=180)
          formatter()
          PY
          python scripts/format_java.py --check
      - name: Run pure-JVM regression checks
        run: |
          python android-tv/tests/run_checks.py
          python android-tv/tests/run_direct_cms_import_checks.py
          python android-tv/tests/run_global_search_checks.py
          python android-tv/tests/run_scheduling_checks.py
          python android-tv/tests/run_config_library_checks.py
          python android-tv/tests/run_live_checks.py
          python android-tv/tests/run_seek_checks.py
          python android-tv/tests/run_review_fix_checks.py
          python android-tv/tests/run_update_checks.py
          python android-tv/tests/run_tv_input_checks.py
          python android-tv/tests/run_local_package_checks.py
          python android-tv/tests/run_python_package_checks.py
          python android-tv/tests/run_script_proxy_checks.py
          python android-tv/tests/run_catvod_transport_checks.py
          python android-tv/tests/run_drpy_checks.py
          python android-tv/tests/run_node_capability_checks.py
          python android-tv/tests/run_emby_checks.py
          python android-tv/tests/run_compat_checks.py
          python android-tv/tests/run_favorites_checks.py
          python android-tv/tests/run_download_security_checks.py
          python android-tv/tests/run_warehouse_checks.py
          python android-tv/tests/run_video_filter_checks.py
          python android-tv/tests/run_glasswork_checks.py
          python android-tv/tests/run_js_player_checks.py
          python android-tv/tests/run_lane_e_checks.py
          python android-tv/tests/run_cast_search_picker_checks.py
          python android-tv/tests/run_tv_playback_and_ratings_checks.py
          python android-tv/tests/run_player_lock_checks.py
          python android-tv/tests/run_conformance_checks.py
          python android-mobile/tests/run_checks.py
          python android-mobile/tests/run_review_fix_checks.py
          python android-mobile/tests/run_update_checks.py
          python android-mobile/tests/run_conformance_checks.py
          python scripts/test_lite_conformance.py
          python -m unittest discover -s flutter -p "test_*.py"
          python -m unittest discover -s tvos -p "test_*.py"
          python scripts/test_movie_mirror.py
          python scripts/test_platform_packages.py
          python scripts/test_ios_python_packaging.py
          python scripts/test_ios_crypto.py
          python scripts/test_catpaw_host.py
          python scripts/test_guard_bootstrap.py
          python scripts/test_appgz_host.py
          node --jitless scripts/test_t4_adapter.cjs
          python scripts/test_t4_adapter.py
          node --jitless scripts/test_fy_adapter.cjs
          python scripts/test_fy_adapter.py
      - name: Run Flutter tri-platform conformance tests
        working-directory: flutter
        run: |
          python prepare_platform.py
          flutter pub get
          flutter test test/conformance_test.dart test/harmonyos_and_tv_ui_test.dart
      - name: Shared script runtime and native patch checks
        run: |
          node scripts/test_js_module_interop.cjs
          node --jitless scripts/test_catvod_profile.cjs
          node scripts/test_python_host.js
          node scripts/test_python_json.js
          node scripts/test_python_io.js
          node scripts/test_python_package.js
          node scripts/test_python_proxy.js
          python scripts/test_catpaw_node_patches.py
          python scripts/test_catpaw_runtime_bundle.py
      - name: Check CatPaw without JIT or WebAssembly
        env:
          MARCOMOVIE_NODE_FLAGS: --jitless --experimental-permission --allow-worker --allow-fs-read=* --allow-fs-write=*
        run: python scripts/test_catpaw_host.py

  build-android-tv:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' || inputs.target == 'android-tv'
    name: Build & Verify Android TV & Lite APK
    needs: [verify-and-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;28.2.13676358'
      - name: Locate Android SDK Build-Tools & build TV / Lite APKs
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          export MARCOMOVIE_BUILD_TOOLS="$BUILD_TOOLS"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python scripts/build_android_tv.py
          python android-tv/tests/run_api23_callback_checks.py
          python android-tv/tests/run_hq_upgrade_checks.py
          python android-tv/tests/run_tv_ux_optimization_checks.py
          python android-tv/tests/run_tv_061_feedback_checks.py
          python android-tv/tests/run_tv_063_optimization_checks.py
          python android-tv/tests/run_tv_063_batch2_checks.py
          python android-tv/tests/run_tv_063_batch3_checks.py
          python android-tv/tests/run_checks.py
          python android-tv/tests/run_guard_checks.py
          python android-tv/tests/run_conformance_checks.py
          python scripts/test_lite_conformance.py
          python scripts/build_lite.py
          python scripts/test_lite_jvm.py
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-Android-TV-APK
          path: |
            dist/*-android-tv.apk
            dist/*-android-tv.apk.sha256
            dist/*-preview.apk
            dist/*-preview.apk.sha256
            dist/*-android-lite.apk
            dist/*-android-lite.apk.sha256
            dist/*-lite.apk
            dist/*-lite.apk.sha256
            android-tv/build/build-validation.json

  build-android-mobile:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' || inputs.target == 'android-mobile'
    name: Build & Verify Android Mobile APK
    needs: [verify-and-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;28.2.13676358'
      - name: Locate Android SDK Build-Tools & build Mobile APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          export MARCOMOVIE_BUILD_TOOLS="$BUILD_TOOLS"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python scripts/build_android_mobile.py
          python android-mobile/tests/run_api23_callback_checks.py
          python android-mobile/tests/run_checks.py
          python android-mobile/tests/run_review_fix_checks.py
          python android-mobile/tests/run_guard_checks.py
          python android-mobile/tests/run_conformance_checks.py
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-Android-Mobile-APK
          path: |
            dist/*-android-mobile.apk
            dist/*-android-mobile.apk.sha256
            dist/*-mobile.apk
            dist/*-mobile.apk.sha256
            android-mobile/build/build-validation.json

  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'desktop' || inputs.target == 'windows'
    name: Build Windows Desktop (x64)
    needs: [verify-and-checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.38.9"
      - name: Validate Windows installer script before building the application
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          python scripts/test_windows_installer.py --compiler "$iscc"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Generate platform runner & build Windows release
        working-directory: flutter
        run: |
          python prepare_platform.py
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=marco_movie .
          python prepare_platform.py
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake -S packages/quickjs_engine/native -B packages/quickjs_engine/native/build -A x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build packages/quickjs_engine/native/build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $editions = Get-Content edition-versions.json -Raw | ConvertFrom-Json
          $version = $editions.windows.versionName
          $buildNum = $editions.windows.buildNumber
          flutter build windows --release --build-name="$version" --build-number="$buildNum"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $releaseDir = "build/windows/x64/runner/Release"
          $env:MARCOMOVIE_TEST_MPV = "$PWD/$releaseDir/libmpv-2.dll"
          flutter test test/native_cloud_playback_test.dart test/challenger_empirical_m2_test.dart test/player_stream_cleanup_test.dart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item Env:MARCOMOVIE_TEST_MPV
          python ../scripts/prepare_catpaw_runtime.py --platform windows --destination "$releaseDir/data/node"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python ../scripts/prepare_windows_python_runtime.py --destination "$releaseDir/data/python" --verify
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "concrt140.dll")) {
            $sysDll = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $sysDll) {
              Copy-Item $sysDll -Destination $releaseDir -Force
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $zipName = "MarcoMovie-$version-windows-x64.zip"
          Copy-Item "windows/runner/resources/app_icon.ico" "$releaseDir/MarcoMovie-$version.ico" -Force
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "dist/$zipName" -Force
          $hash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/$zipName.sha256", "$hash  $zipName`n", [System.Text.Encoding]::ASCII)
          python ../scripts/platform_package_names.py --folder dist --platform windows --version "$version"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-Windows-x64
          path: |
            flutter/dist/*.exe
            flutter/dist/*.zip
            flutter/dist/*.sha256

  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'desktop' || inputs.target == 'macos'
    name: Build macOS Desktop (Apple Silicon & Intel)
    needs: [verify-and-checks]
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.38.9"
      - name: Generate platform runner & build macOS release
        working-directory: flutter
        run: |
          python3 prepare_platform.py
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --project-name=marco_movie .
          python3 prepare_platform.py
          flutter pub get
          cmake -S packages/quickjs_engine/native -B packages/quickjs_engine/native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build packages/quickjs_engine/native/build --parallel 4
          flutter test
          VERSION=$(python3 -c "import json; print(json.load(open('edition-versions.json'))['macos']['versionName'])")
          BUILD_NUM=$(python3 -c "import json; print(json.load(open('edition-versions.json'))['macos']['buildNumber'])")
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUM"
          APP=$(find "$PWD/build/macos/Build/Products/Release" -maxdepth 1 -name '*.app' -print -quit)
          DYLD_FRAMEWORK_PATH="$APP/Contents/Frameworks" MARCOMOVIE_TEST_MPV="$APP/Contents/Frameworks/Mpv.framework/Mpv" flutter test test/native_cloud_playback_test.dart
          python3 ../scripts/prepare_catpaw_runtime.py --platform macos --destination "$APP/Contents/Frameworks/node"
          codesign --force --deep --sign - --preserve-metadata=entitlements "$APP"
          mkdir -p dist
          ZIP_NAME="MarcoMovie-$VERSION-macos.zip"
          (cd build/macos/Build/Products/Release && ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/flutter/dist/$ZIP_NAME")
          (cd dist && shasum -a 256 "$ZIP_NAME" > "$ZIP_NAME.sha256")
          python3 ../scripts/platform_package_names.py --folder dist --platform macos --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-macOS-App
          path: |
            flutter/dist/*.zip
            flutter/dist/*.sha256

  build-ios:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios'
    name: Build iOS & iPadOS (.ipa unsigned, iOS 27.1 / iPhone Duo & Liquid Glass SDK)
    needs: [verify-and-checks]
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode 27 (iOS 27.1+ SDK for iPhone Duo)
        run: |
          BEST_XCODE=""
          for candidate in $(ls -d /Applications/Xcode_27*.app /Applications/Xcode.app 2>/dev/null | sort -V); do
            if [ -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              BEST_XCODE="$candidate"
            fi
          done
          if [ -n "$BEST_XCODE" ]; then
            echo "Selecting Xcode toolchain: $BEST_XCODE"
            sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.9"
      - name: Fetch verified iOS runtime inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          from urllib.parse import urlsplit
          from scripts.ios_cpython.run_cpython_probe import URL, SHA256
          from scripts.prepare_catpaw_runtime import ASSETS
          for url, expected, folder in [(URL, SHA256, Path('tools/python-ios')), (*ASSETS['ios'], Path('tools/catpaw'))]:
              parts = urlsplit(url).path.strip('/').split('/')
              if urlsplit(url).hostname != 'github.com' or len(parts) != 6 or parts[2:4] != ['releases', 'download']:
                  raise ValueError('Expected a pinned GitHub release asset')
              folder.mkdir(parents=True, exist_ok=True)
              target = folder / parts[-1]
              if not target.exists():
                  subprocess.run(['gh', 'release', 'download', parts[4], '--repo', '/'.join(parts[:2]),
                                  '--pattern', parts[-1], '--dir', str(folder)], check=True, timeout=180)
              if hashlib.sha256(target.read_bytes()).hexdigest() != expected:
                  raise ValueError('Runtime asset SHA-256 mismatch')
          PY
      - name: Generate iOS platform runner
        working-directory: flutter
        run: |
          python3 prepare_platform.py
          flutter create --platforms=ios --org com.pilipala --project-name=marco_movie .
          python3 prepare_platform.py
      - name: Identify iOS Python stage inputs and toolchain
        id: ios-python-cache-key
        run: |
          python3 -m unittest scripts.test_ios_runtime_cache
          python3 scripts/ios_runtime_cache.py key --target device --arch arm64 --github-output "$GITHUB_OUTPUT"
      - name: Restore exact iOS Python stage
        id: ios-python-cache
        uses: actions/cache/restore@v4
        with:
          path: flutter/build/python-runtime
          key: ${{ steps.ios-python-cache-key.outputs.key }}
      - name: Prepare verified iOS Python stage
        working-directory: flutter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../scripts/ios_runtime_cache.py validate --stage-dir build/python-runtime --target device --arch arm64
          python3 ../scripts/prepare_ios_python_runtime.py prepare --stage-dir build/python-runtime --frameworks packages/python_source_runtime/ios/Frameworks
      - name: Save verified iOS Python stage
        if: steps.ios-python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: flutter/build/python-runtime
          key: ${{ steps.ios-python-cache-key.outputs.key }}
      - name: Build iOS/iPadOS IPA
        working-directory: flutter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../scripts/prepare_catpaw_runtime.py --platform ios --destination packages/catpaw_runtime/ios/Frameworks
          flutter pub get
          python3 ../scripts/prepare_ios_media_runtime.py --package-config .dart_tool/package_config.json
          cmake -S packages/quickjs_engine/native -B packages/quickjs_engine/native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build packages/quickjs_engine/native/build --parallel 4
          flutter test
          VERSION=$(python3 -c "import json; print(json.load(open('edition-versions.json'))['ios']['versionName'])")
          BUILD_NUM=$(python3 -c "import json; print(json.load(open('edition-versions.json'))['ios']['buildNumber'])")
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUM" --verbose > build/ios-build.log 2>&1; then
            tail -n 160 build/ios-build.log
            exit 1
          fi
          python3 ../scripts/prepare_ios_python_runtime.py embed --stage-dir build/python-runtime --app build/ios/iphoneos/Runner.app
          python3 patch_ios_ipa.py build/ios/iphoneos/Runner.app
          IPA_NAME="MarcoMovie-$VERSION-ios-unsigned.ipa"
          mkdir -p build/ios/ipa/Payload dist
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qry "$GITHUB_WORKSPACE/flutter/dist/$IPA_NAME" Payload)
          (cd dist && shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256")
          python3 ../scripts/platform_package_names.py --folder dist --platform ios --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-iOS-iPadOS-IPA
          path: |
            flutter/dist/*.ipa
            flutter/dist/*.sha256

      - name: Retain iOS build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-diagnostics
          retention-days: 7
          path: |
            flutter/build/ios-build.log
            flutter/build/python-runtime/crypto-logs/*.log
            flutter/build/python-runtime/lxml-logs/*.log
            flutter/build/python-runtime/lxml-logs/*.json
            flutter/ios/Pods/Target Support Files/catpaw_runtime/*.xcconfig

  build-appletv:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'appletv'
    name: Build Apple TV (tvOS 16.0+ .ipa unsigned)
    needs: [verify-and-checks]
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare tvOS QuickJS/JS-Host sources, icons & Xcode project
        run: python3 tvos/prepare_tvos.py
      - name: Run MarcoTVCore Swift unit & 20-case conformance tests
        working-directory: tvos
        run: swift test
      - name: Build Apple TV Release .app and package unsigned .ipa
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('flutter/edition-versions.json'))['appletv']['versionName'])")
          BUILD_NUM=$(python3 -c "import json; print(json.load(open('flutter/edition-versions.json'))['appletv']['buildNumber'])")
          xcodebuild \
            -project tvos/RunnerProject/MarcoMovieTV.xcodeproj \
            -scheme MarcoMovieTV \
            -sdk appletvos \
            -configuration Release \
            -derivedDataPath tvos/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="tvos/DerivedData/Build/Products/Release-appletvos/MarcoMovieTV.app"
          mkdir -p flutter/dist
          IPA_NAME="MarcoMovie-$VERSION-appletv-unsigned.ipa"
          python3 tvos/patch_tvos_ipa.py "$APP_PATH" --ipa "flutter/dist/$IPA_NAME"
          (cd flutter/dist && shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256")
          python3 scripts/platform_package_names.py --folder flutter/dist --platform appletv --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-AppleTV-IPA
          path: |
            flutter/dist/*.ipa
            flutter/dist/*.sha256

  build-harmonyos:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'harmonyos'
    name: Build HarmonyOS NEXT Universal HAP (Phone / Tablet / 2in1 / Smart Screen)
    needs: [verify-and-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - name: Install Linux texture compression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev
      - name: Setup HarmonyOS Command Line Tools & SDK
        uses: ErBWs/setup-ohos@v2
        with:
          version: "26.0.0.821"
          cache: true
      - name: Restore or clone OpenHarmony Flutter SDK
        id: ohos-flutter-cache
        uses: actions/cache@v4
        with:
          path: /tmp/flutter-ohos-sdk
          key: flutter-ohos-sdk-v2-${{ vars.OHOS_FLUTTER_REF || 'oh-3.35.7-release' }}
      - name: Ensure OpenHarmony Flutter SDK & DevEco env vars are ready
        env:
          OHOS_FLUTTER_REPO: ${{ vars.OHOS_FLUTTER_REPO || 'https://gitcode.com/openharmony-sig/flutter_flutter.git' }}
          OHOS_FLUTTER_REF: ${{ vars.OHOS_FLUTTER_REF || 'oh-3.35.7-release' }}
        run: |
          if [ ! -x "/tmp/flutter-ohos-sdk/bin/flutter" ]; then
            rm -rf /tmp/flutter-ohos-sdk
            git clone --depth 1 --branch "$OHOS_FLUTTER_REF" "$OHOS_FLUTTER_REPO" /tmp/flutter-ohos-sdk
          fi
          git -C /tmp/flutter-ohos-sdk config user.email "ci@localhost"
          git -C /tmp/flutter-ohos-sdk config user.name "CI"
          git -C /tmp/flutter-ohos-sdk tag -f -a "3.35.7" -m "Flutter 3.35.7 OHOS"
          printf '3.35.7\n' > /tmp/flutter-ohos-sdk/version
          rm -f /tmp/flutter-ohos-sdk/bin/cache/flutter.version.json
          echo "FLUTTER_ROOT=/tmp/flutter-ohos-sdk" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          echo "TOOL_HOME=$(dirname "$HOS_SDK_HOME")" >> "$GITHUB_ENV"
          echo "/tmp/flutter-ohos-sdk/bin" >> "$GITHUB_PATH"
          /tmp/flutter-ohos-sdk/bin/flutter --version
      - name: Prepare HarmonyOS Stage-model runner & build Universal HAP
        working-directory: flutter
        run: |
          python3 prepare_platform.py
          python3 prepare_ohos.py --patch-pubspec
          trap 'python3 prepare_ohos.py --restore-pubspec' EXIT
          rm -rf /tmp/marco-ohos-overlay
          mv ohos /tmp/marco-ohos-overlay
          flutter create --platforms=ohos --org com.pilipala --project-name=marco_movie .
          rm -f test/widget_test.dart
          cp /tmp/marco-ohos-overlay/entry/src/main/ets/entryability/EntryAbility.ets ohos/entry/src/main/ets/entryability/EntryAbility.ets
          cp /tmp/marco-ohos-overlay/entry/src/main/ets/pages/Index.ets ohos/entry/src/main/ets/pages/Index.ets
          mkdir -p ohos/entry/src/main/ets/plugins
          cp /tmp/marco-ohos-overlay/entry/src/main/ets/plugins/Ohos*.ets ohos/entry/src/main/ets/plugins/
          cp /tmp/marco-ohos-overlay/entry/src/main/ets/plugins/Ohos*.ts ohos/entry/src/main/ets/plugins/
          mkdir -p ohos/entry/src/main/cpp
          cp -r /tmp/marco-ohos-overlay/entry/src/main/cpp/* ohos/entry/src/main/cpp/
          cp /tmp/marco-ohos-overlay/AppScope/resources/base/element/string.json ohos/AppScope/resources/base/element/string.json
          cp /tmp/marco-ohos-overlay/entry/src/main/resources/base/element/* ohos/entry/src/main/resources/base/element/
          python3 prepare_ohos.py
          flutter pub get
          VERSION=$(python3 -c "import json; print(json.load(open('edition-versions.json'))['harmonyos']['versionName'])")
          BUILD_NUM=$(python3 -c "import json; print(json.load(open('edition-versions.json'))['harmonyos']['buildNumber'])")
          if ! flutter build hap --release --target-platform ohos-arm64 --build-name="$VERSION" --build-number="$BUILD_NUM"; then
            HAP_CHECK=$(find ohos/entry/build -name '*.hap' | sort | head -n 1)
            if [ -z "$HAP_CHECK" ] || [ ! -f "$HAP_CHECK" ]; then
              echo "=== Hvigor diagnostic build logs ===" >&2
              find ohos/.hvigor -name '*.log' -exec tail -n 120 {} + >&2 || true
              exit 1
            fi
            echo "Unsigned HAP packaged at $HAP_CHECK (no signingConfig configured in CI)."
          fi
          HAP_SRC=$(find ohos/entry/build -name '*.hap' | sort | head -n 1)
          if [ -z "$HAP_SRC" ] || [ ! -f "$HAP_SRC" ]; then
            echo "ERROR: Expected .hap output under ohos/entry/build/default/outputs/default" >&2
            exit 1
          fi
          mkdir -p dist
          HAP_NAME="MarcoMovie-$VERSION-harmonyos.hap"
          cp "$HAP_SRC" "dist/$HAP_NAME"
          (cd dist && sha256sum "$HAP_NAME" > "$HAP_NAME.sha256")
          python3 ../scripts/platform_package_names.py --folder dist --platform harmonyos --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-HarmonyOS-HAP
          path: |
            flutter/dist/*.hap
            flutter/dist/*.sha256

  publish-release:
    name: Attach Multiplatform Assets & Promote Official Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android-tv, build-android-mobile, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: MarcoMovie-*
          merge-multiple: true
      - name: Upload assets & mark release as Latest official release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION%-preview}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" release-artifacts/MarcoMovie-*-windows-*.exe* release-artifacts/MarcoMovie-*-windows-*.zip* release-artifacts/MarcoMovie-*-macos*.zip* release-artifacts/MarcoMovie-*-ios-*.ipa* --clobber
            # Keep draft releases private until all official-signed APKs, source,
            # platform packages and checksums have been verified together.
            if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "false" ]; then
              gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false --latest --title "Marco Movie $VERSION"
            fi
          fi
