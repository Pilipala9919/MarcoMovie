name: Cross-platform HTTP and Python source regression
on:
  workflow_dispatch:
  push:
    branches: ['main', 'fix/plugin-ports-16kb-*']
    paths:
      - '.github/workflows/http-source.yml'
      - 'flutter/src/core/cms_client.dart'
      - 'flutter/src/core/js_source_host.dart'
      - 'flutter/src/core/models.dart'
      - 'flutter/src/core/cms_parser.dart'
      - 'flutter/src/core/live_catalog_parser.dart'
      - 'flutter/src/core/storage_service.dart'
      - 'flutter/src/core/quark_account.dart'
      - 'flutter/src/core/quark_drive.dart'
      - 'flutter/src/core/netdisk_service.dart'
      - 'flutter/src/ui/netdisk_sheet.dart'
      - 'flutter/src/ui/local_qr_code.dart'
      - 'flutter/src/ui/quark_library_sheet.dart'
      - 'flutter/test/quark*_test.dart'
      - 'flutter/test/netdisk_login_ui_test.dart'
      - 'flutter/test/live_catalog_test.dart'
      - 'flutter/test/subscription_delete_ui_test.dart'
      - 'android/src/main/assets/js-host/module-interop.js'
      - 'flutter/src/core/source_playback.dart'
      - 'flutter/test/http_t4_test.dart'
      - 'flutter/test/subscription_redirect_test.dart'
      - 'flutter/test/source_playback_test.dart'
      - 'flutter/test/commonjs_references_test.dart'
      - 'flutter/test/source_verification_test.dart'
      - 'flutter/src/core/python_source_assets.dart'
      - 'flutter/src/core/python_http_transport.dart'
      - 'flutter/src/core/python_source_sessions.dart'
      - 'flutter/src/core/python_source_channel.dart'
      - 'flutter/src/core/python_source_host.dart'
      - 'flutter/src/core/script_proxy_protocol.dart'
      - 'flutter/src/core/script_proxy_server.dart'
      - 'flutter/src/ui/detail_screen.dart'
      - 'flutter/src/ui/adaptive_shell.dart'
      - 'flutter/test/source_operation_test.dart'
      - 'flutter/test/source_operation_completion_test.dart'
      - 'flutter/test/detail_loading_test.dart'
      - 'flutter/test/home_loading_test.dart'
      - 'flutter/test/python*.dart'
      - 'android/src/main/assets/python-host/**'
      - 'scripts/prepare_python_html.py'
permissions:
  contents: read
jobs:
  http:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: python flutter/prepare_platform.py
      - run: flutter pub get
        working-directory: flutter
      - name: Configure Windows test runtime
        if: runner.os == 'Windows'
        working-directory: flutter
        run: cmake -S packages/quickjs_engine/native -B packages/quickjs_engine/native/build -A x64
      - name: Configure macOS test runtime
        if: runner.os == 'macOS'
        working-directory: flutter
        run: cmake -S packages/quickjs_engine/native -B packages/quickjs_engine/native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build production QuickJS test runtime
        working-directory: flutter
        run: cmake --build packages/quickjs_engine/native/build --config Release --parallel 4
      - name: Test actual HTTP transport with local fixtures
        working-directory: flutter
        run: flutter test --reporter json test/http_t4_test.dart test/subscription_redirect_test.dart test/source_playback_test.dart test/python_html_test.dart test/python_host_compat_test.dart test/python_remote_modules_test.dart test/python_package_test.dart test/python_json_test.dart test/python_io_test.dart test/python_http_transport_test.dart test/python_source_sessions_test.dart test/python_source_channel_test.dart test/python_native_dispatch_test.dart test/source_operation_test.dart test/source_operation_completion_test.dart test/detail_loading_test.dart test/home_loading_test.dart test/live_catalog_test.dart test/subscription_delete_ui_test.dart test/commonjs_references_test.dart test/source_verification_test.dart test/quark_account_test.dart test/quark_drive_test.dart test/netdisk_login_ui_test.dart test/quark_library_ui_test.dart > http-source-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-source-evidence-${{ matrix.os }}
          path: flutter/http-source-results.jsonl
          retention-days: 14
