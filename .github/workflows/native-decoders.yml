name: Build native decoders
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed NDK
        run: sdkmanager 'ndk;26.1.10909125'
      - name: Compile ARMv7 decoder libraries and package corresponding sources
        run: python scripts/native/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: marco-native-decoders
          path: native-output/*
          if-no-files-found: error
          retention-days: 14
