name: Public content checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_content.py

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned JS compile dependencies
        run: python scripts/prepare_js_test_dependencies.py
      - name: Offline behavior checks
        run: |
          python android/tests/run_checks.py
          python android/tests/run_compat_checks.py
          python android/tests/run_global_search_checks.py
          python android/tests/run_js_player_checks.py
          python android/tests/run_scheduling_checks.py
          python android/tests/run_favorites_checks.py
          python android/tests/run_live_checks.py
          python android/tests/run_decoder_checks.py
