name: Record Marco Movie usage tutorials
on:
  push:
    branches: ['video/usage-showcase-20261109']
    paths: ['.github/workflows/showcase-record.yml', 'scripts/record_showcase.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        edition: [mobile, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare recording tools and public demo media
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python scripts/record_showcase.py prepare ${{ matrix.edition }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python scripts/record_showcase.py record ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-${{ matrix.edition }}
          path: recording/output/
          retention-days: 14
